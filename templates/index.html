<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rando-mon — Champion Team Generator</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f1a;
      --surface:   #1c1c2e;
      --border:    #2e2e4a;
      --text:      #e8e8f0;
      --muted:     #8888aa;
      --accent:    #7c6fcd;
      --accent-hi: #a89cf0;
      --gold:      #f5c842;
      --core-line: #2a2a40;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 {
      font-size: 2rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent-hi);
    }
    header p {
      color: var(--muted);
      margin-top: .3rem;
      font-size: .9rem;
      letter-spacing: .06em;
    }

    /* ── Generate button ── */
    #generate-btn {
      display: block;
      margin: 0 auto 2.5rem;
      padding: .75rem 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    #generate-btn:hover  { background: var(--accent-hi); }
    #generate-btn:active { transform: scale(.97); }
    #generate-btn:disabled { opacity: .5; cursor: default; }

    /* ── Main card ── */
    #output {
      width: 100%;
      max-width: 600px;
    }
    #output:empty { display: none; }

    .trio-banner {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: .5rem .75rem;
      background: var(--core-line);
      border-radius: 6px 6px 0 0;
    }
    .trio-banner span { color: var(--accent-hi); }

    .team-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 10px 10px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    .mon-row {
      display: flex;
      align-items: center;
      gap: .9rem;
      padding: .6rem .9rem;
      border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    .mon-row:last-child { border-bottom: none; }
    .mon-row:hover { background: rgba(124,111,205,.08); }
    .mon-row.free-slot { opacity: .85; }

    .sprite {
      width: 56px;
      height: 56px;
      image-rendering: pixelated;
      flex-shrink: 0;
    }
    .sprite-placeholder {
      width: 56px; height: 56px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--border);
    }

    .mon-info { flex: 1; min-width: 0; }

    .mon-name {
      font-weight: 600;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mega-star {
      color: var(--gold);
      margin-left: .3em;
      font-size: .85em;
      title: "Can Mega Evolve";
    }

    .type-row { display: flex; gap: .35rem; margin-top: .3rem; flex-wrap: wrap; }
    .type-badge {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .18em .55em;
      border-radius: 4px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.4);
    }

    .slot-tag {
      font-size: .65rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: .2rem;
    }
    .slot-tag.core { color: var(--accent-hi); }

    /* ── Permalink section ── */
    #link-section {
      display: none;
      width: 100%;
      max-width: 600px;
      margin-top: .25rem;
    }
    #link-section label {
      display: block;
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .4rem;
    }
    .link-row {
      display: flex;
      gap: .5rem;
    }
    #link-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: .875rem;
      font-family: monospace;
      padding: .5rem .75rem;
      outline: none;
      min-width: 0;
    }
    #link-input:focus { border-color: var(--accent); }

    #copy-btn {
      padding: .5rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--accent-hi);
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s, border-color .12s;
      flex-shrink: 0;
    }
    #copy-btn:hover { background: var(--border); border-color: var(--accent); }
    #copy-btn.copied { color: #6fcf97; border-color: #6fcf97; }

    /* ── Error ── */
    #error-msg {
      display: none;
      color: #e07070;
      font-size: .9rem;
      text-align: center;
      margin-bottom: 1rem;
    }

    /* ── Type colours (standard Pokémon palette) ── */
    .t-normal   { background: #9099a1; }
    .t-fire     { background: #e8622a; }
    .t-water    { background: #4c90d8; }
    .t-electric { background: #f2c029; color: #333 !important; text-shadow: none !important; }
    .t-grass    { background: #4dab3e; }
    .t-ice      { background: #70cfc1; color: #333 !important; text-shadow: none !important; }
    .t-fighting { background: #ce4069; }
    .t-poison   { background: #a65cc5; }
    .t-ground   { background: #cf7a43; }
    .t-flying   { background: #8fa8dd; }
    .t-psychic  { background: #e8647e; }
    .t-bug      { background: #90be42; color: #333 !important; text-shadow: none !important; }
    .t-rock     { background: #c9b959; color: #333 !important; text-shadow: none !important; }
    .t-ghost    { background: #546aad; }
    .t-dragon   { background: #0a6dc4; }
    .t-dark     { background: #595369; }
    .t-steel    { background: #5a8ea2; }
    .t-fairy    { background: #e685b5; }
    .t-shadow   { background: #6c4a9e; }
  </style>
</head>
<body>

<header>
  <h1>Rando-mon</h1>
  <p>Champion Team Generator</p>
</header>

<button id="generate-btn">Generate Team</button>

<p id="error-msg"></p>

<div id="output"></div>

<div id="link-section">
  <label for="link-input">Permalink</label>
  <div class="link-row">
    <input id="link-input" type="text" readonly />
    <button id="copy-btn">Copy</button>
  </div>
</div>

<script>
  const SPRITE_BASE =
    'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';

  const generateBtn  = document.getElementById('generate-btn');
  const output       = document.getElementById('output');
  const linkSection  = document.getElementById('link-section');
  const linkInput    = document.getElementById('link-input');
  const copyBtn      = document.getElementById('copy-btn');
  const errorMsg     = document.getElementById('error-msg');

  // ── Rendering ──────────────────────────────────────────────────────────

  function typeBadge(type) {
    const span = document.createElement('span');
    span.className = `type-badge t-${type}`;
    span.textContent = type;
    return span;
  }

  function monRow(mon) {
    const row = document.createElement('div');
    row.className = 'mon-row' + (mon.slot === 'free' ? ' free-slot' : '');

    const img = document.createElement('img');
    img.className = 'sprite';
    img.src = `${SPRITE_BASE}${mon.id}.png`;
    img.alt = mon.name;
    img.onerror = () => {
      const ph = document.createElement('div');
      ph.className = 'sprite-placeholder';
      img.replaceWith(ph);
    };
    row.appendChild(img);

    const info = document.createElement('div');
    info.className = 'mon-info';

    const nameLine = document.createElement('div');
    nameLine.className = 'mon-name';
    nameLine.textContent = mon.name;
    if (mon.is_mega_capable) {
      const star = document.createElement('span');
      star.className = 'mega-star';
      star.textContent = '★';
      star.title = 'Can Mega Evolve';
      nameLine.appendChild(star);
    }
    info.appendChild(nameLine);

    const typeRow = document.createElement('div');
    typeRow.className = 'type-row';
    mon.types.forEach(t => typeRow.appendChild(typeBadge(t)));
    info.appendChild(typeRow);

    row.appendChild(info);

    const tag = document.createElement('span');
    tag.className = `slot-tag ${mon.slot}`;
    tag.textContent = mon.slot;
    row.appendChild(tag);

    return row;
  }

  function renderTeam(data) {
    output.innerHTML = '';

    const banner = document.createElement('div');
    banner.className = 'trio-banner';
    const trioLabel = data.trio
      .map(t => t.charAt(0).toUpperCase() + t.slice(1))
      .join(' / ');
    banner.innerHTML = `Core trio &mdash; <span>${trioLabel}</span>`;
    output.appendChild(banner);

    const list = document.createElement('div');
    list.className = 'team-list';
    data.team.forEach(mon => list.appendChild(monRow(mon)));
    output.appendChild(list);
  }

  function setLink(token) {
    const url = `${location.origin}/team/${token}`;
    linkInput.value = url;
    linkSection.style.display = 'block';
    history.replaceState(null, '', `/team/${token}`);
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  function clearError() {
    errorMsg.style.display = 'none';
    errorMsg.textContent = '';
  }

  // ── Fetch helpers ──────────────────────────────────────────────────────

  async function fetchTeam(url) {
    clearError();
    generateBtn.disabled = true;
    generateBtn.textContent = 'Generating…';
    try {
      const res = await fetch(url);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.description || `HTTP ${res.status}`);
      }
      return await res.json();
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = 'Generate Team';
    }
  }

  async function generate() {
    try {
      const data = await fetchTeam('/api/team');
      renderTeam(data);
      setLink(data.token);
    } catch (err) {
      showError(`Could not generate team: ${err.message}`);
    }
  }

  async function loadToken(token) {
    try {
      const data = await fetchTeam(`/api/team/${token}`);
      // Reconstruct trio label from first 3 mons (unknown on decode path)
      data.trio = null;
      renderTeamFromDecode(data);
      setLink(data.token);
    } catch (err) {
      showError(`Could not load team from link: ${err.message}`);
    }
  }

  function renderTeamFromDecode(data) {
    output.innerHTML = '';

    const banner = document.createElement('div');
    banner.className = 'trio-banner';
    banner.innerHTML = 'Shared team';
    output.appendChild(banner);

    const list = document.createElement('div');
    list.className = 'team-list';
    data.team.forEach(mon => list.appendChild(monRow(mon)));
    output.appendChild(list);
  }

  // ── Copy button ────────────────────────────────────────────────────────

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(linkInput.value);
      copyBtn.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Copy';
        copyBtn.classList.remove('copied');
      }, 2000);
    } catch {
      linkInput.select();
      document.execCommand('copy');
    }
  });

  // ── Init ───────────────────────────────────────────────────────────────

  generateBtn.addEventListener('click', generate);

  const parts = location.pathname.split('/');
  if (parts[1] === 'team' && parts[2]) {
    loadToken(parts[2]);
  }
</script>
</body>
</html>
